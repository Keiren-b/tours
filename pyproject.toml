[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tours"
version = "0.0.1"
description = "a prediction model for walking tour attendance"
authors = [
  { name = "keiren brandt-sawdy" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"


[tool.ruff]
line-length = 99
src = ["tours"]
include = ["pyproject.toml", "tours/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tours"]
force-sort-within-sections = true

[tool.jupytext.formats]
"notebooks/" = "ipynb"
"notebooks/scripts/" = "py:percent"
